# ==============================================================================
# Render Blueprint Specification (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: nexus-ops-swarm
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # Supabase PostgreSQL Database (Optional in free demo, required for live DB)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_SCHEMA
        value: public

      # AI LLM Engine (Optional - cognitive simulation engine runs if blank)
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.5-flash
